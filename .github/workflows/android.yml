name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle-dist/gradle-8.9
          key: gradle-8.9-${{ runner.os }}
      - name: Install Gradle 8.9 (mirror fallback)
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_HOME="$HOME/.gradle-dist/gradle-8.9"
          ZIP="$RUNNER_TEMP/gradle-8.9-bin.zip"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$HOME/.gradle-dist"
            urls=(
              "https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip"
              "https://downloads.gradle.org/distributions/gradle-8.9-bin.zip"
            )
            downloaded=false
            for url in "${urls[@]}"; do
              echo "Trying Gradle distribution: $url"
              if curl --fail --location --retry 2 --retry-all-errors --retry-delay 5 --connect-timeout 30 "$url" --output "$ZIP"; then
                downloaded=true
                break
              fi
              rm -f "$ZIP"
            done
            if [ "$downloaded" != true ]; then
              echo "Could not download Gradle 8.9 from any configured source."
              exit 1
            fi
            unzip -q "$ZIP" -d "$HOME/.gradle-dist"
          fi
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saqib-IPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
